<body>
  <script>
    function oddEven() {}

    function oddEvens(numbers) {
      if (numbers % 2 === 0) {
        return 'Even';
      } else {
        return 'Odd';
      }
    }

    console.log(oddEvens(2));
    //
    function findMax(numbers) {
      let max = numbers[0];

      for (let i = 1; i < numbers.length; i++) {
        if (numbers[i] > max) {
          max = numbers[i];
        }
      }

      return max;
    }

    console.log(findMax([1, 2, 3, 4]));
    //
    function doubleArray(array) {
      let newArray = [];

      for (let i = 0; i < array.length; i++) {
        let doubledNumber = array[i] * 2;
        newArray.push(doubledNumber);
      }

      return newArray;
    }

    console.log(doubleArray([1, 2, 3]));
    //
    function greaterThan10(array) {
      let newArray = [];

      for (let i = 0; i < array.length; i++) {
        if (array[i] >= 10) {
          newArray.push(array[i]);
        }
      }

      return newArray;
    }

    console.log(greaterThan10([1, 3, 20, 15]));
    //
    function add(x, y) {
      return x + y;
    }

    console.log(add(3, 4));

    for (let i = 1; i <= 5; i++) {
      console.log(i);
    }
    //
    function filterNumbers(arr) {
      let result = [];

      for (let i = 0; i < arr.length; i++) {
        if (arr[i] > 10) {
          result.push(arr[i]);
        }
      }

      return result;
    }

    console.log(filterNumbers([5, 12, 8, 20]));
    //
    function sumEvens(numbers) {
      let result = [];

      numbers.forEach(function (number) {
        if (number % 2 === 0) {
          result.push(number);
        }
      });

      return result;
    }
    //
    function sumGreaterThanFive(numbers) {
      let total = 0;
      for (let i = 0; i < numbers.length; i++) {
        if (numbers[i] > 5) {
          total += numbers[i];
        }
      }
      return total;
    }

    console.log(sumGreaterThanFive([1, 10, 30, 20, 5]));
    //
    function doubleArrayButDivisibleByThree(array) {
      let newArray = [];
      let divisibleByThree = [];

      for (let i = 0; i < array.length; i++) {
        if (array[i] % 3 === 0) {
          divisibleByThree.push(array[i]);
        } else {
          let doubledNumber = array[i] * 2;
          newArray.push(doubledNumber);
        }
      }

      return newArray;
    }

    console.log(doubleArrayButDivisibleByThree([1, 2, 3]));
  </script>
</body>

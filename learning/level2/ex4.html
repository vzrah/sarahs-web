<!doctype html>
<html>
  <head>
    <title>Exercise 4</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h2 class="card-title mb-3">
                Find Passed Students with Array.filter
              </h2>
              <p class="mb-4">
                Click the button to filter students who passed (score 60 or
                above) and render them in a Bootstrap table.
              </p>

              <button class="btn btn-success mb-3" onclick="renderScoreboard()">
                Show Passed Students
              </button>

              <div id="result"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      //javascript woah

      const students = [
        { name: 'Maximus prime', score: 80 },
        { name: 'Bossbaby', score: 10 },
        { name: 'Moon Walker', score: 96 },
        { name: 'Q', score: 77 },
        { name: 'Lil Nas X', score: 6 },
      ];

      const passingMark = students.filter(
        (currentItem) => currentItem.score >= 60,
      );
      console.log(passingMark);

      function renderScoreboard() {
        const resultDiv = document.querySelector('#result');
        let tableBody = '';

        passingMark.forEach((currentItem, index) => {
          tableBody =
            tableBody +
            `
            <tr>
              <td>${index + 1}</td>
              <td>${currentItem.name}</td>
              <td>${currentItem.score}</td>
            </tr>
          `;
        });

        const table = `
      <table class="table">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Name</th>
            <th scope="col">Score</th>
          </tr>
          <tbody>${tableBody}</tbody>
        </thead>
        
      </table>`;
        resultDiv.innerHTML = table;
      }
    </script>
  </body>
</html>
